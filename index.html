<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתגר תורנות AI - מחלקה פנימית</title>
    
    <!-- ייבוא Tailwind CSS לעיצוב -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ייבוא Lucide לאייקונים -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 p-4 flex flex-col items-center justify-center bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black">

    <div id="app" class="w-full max-w-2xl w-full">
        <!-- התוכן יוזרק לכאן על ידי JavaScript -->
    </div>

    <script>
        const scenarios = [
            {
                id: 1,
                title: "סיכום משמרת אוטומטי",
                context: "מטופל בן 65, התקבל עם קוצר נשימה. רגיש לפניצילין.",
                aiOutput: "סיכום AI: המטופל יציב, סטורציה 96%. הונחה להמשך טיפול באנטיביוטיקה מסוג מוקסיפן (Amoxicillin). מומלץ שחרור.",
                options: [
                    { value: "approve", label: "אישור ויישום בתיק הרפואי" },
                    { value: "reject", label: "סכנה: דחייה ועריכת הסיכום" },
                    { value: "ignore", label: "התעלמות והמשך הלאה" }
                ],
                correctAction: "reject",
                explanation: "סכנה! ה-AI יצר 'הזיה' (Hallucination) והמליץ על תרופה ממשפחת הפניצילין למרות הרגישות. תמיד חובה לבדוק את הפלט מול התיק הרפואי (Human in the loop), אי אפשר לסמוך עליו בעיניים עצומות."
            },
            {
                id: 2,
                title: "הערכה קלינית - כאבים בחזה",
                context: "אחות מקלידה למערכת בקשה להערכת סימפטומים: 'מטופלת בת 45, מדווחת על עייפות קיצונית בימים האחרונים, תחושת קוצר נשימה במאמץ קל וכאב עמום בבטן העליונה. מדדים תקינים'.",
                aiOutput: "תשובת המערכת: 'סביר להניח שמדובר בחרדה או סטרס נפשי. התסמינים אינם טיפוסיים לאירוע לבבי קלאסי. מומלץ מעקב קהילתי'.",
                options: [
                    { value: "valid", label: "תשובה תקינה לחלוטין" },
                    { value: "bias", label: "סכנה: יש כאן הטייה (Bias) של המודל" },
                    { value: "hallucination", label: "סכנה: יש כאן הזיה (Hallucination)" }
                ],
                correctAction: "bias",
                explanation: "נכון מאוד! זוהי הטייה (Bias) מגדרית קלאסית. נשים חוות לעיתים אירועי לב בצורה שונה (עייפות, כאב עמום). מכיוון שהמודלים אומנו היסטורית בעיקר על נתונים של גברים עם כאב חזה מקרין לכתף, המערכת מסיקה שזו חרדה, מה שעלול להוביל לסכנת חיים למטופלת."
            },
            {
                id: 3,
                title: "חיפוש מידע תרופתי",
                context: "אחות שואלת את צ'אט ה-AI של המחלקה: 'מה המינון המקובל להתחלת טיפול באוזמפיק (Ozempic) לסוכרת סוג 2?'",
                aiOutput: "תשובת המערכת: 'המינון ההתחלתי המומלץ ל-Ozempic הוא 2.0 מ\"ג פעם בשבוע בהזרקה תת-עורית, ולאחר חודש ניתן לעלות ל-4.0 מ\"ג'.",
                options: [
                    { value: "valid", label: "תשובה תקינה לחלוטין" },
                    { value: "bias", label: "סכנה: יש כאן הטייה (Bias) של המודל" },
                    { value: "hallucination", label: "סכנה: יש כאן הזיה (Hallucination)" }
                ],
                correctAction: "hallucination",
                explanation: "מעולה שתפסת את זה! זוהי הזיה (Hallucination) מסוכנת. המינון ההתחלתי האמיתי הוא 0.25 מ\"ג. המודל פשוט 'המציא' מספרים שנשמעים סבירים והלביש אותם בתשובה שנראית מקצועית ובטוחה בעצמה."
            },
            {
                id: 4,
                title: "זיהוי סוג המערכת",
                context: "הוכנסה למחלקה מערכת חדשה המנתחת צילומי רנטגן. המערכת סורקת את הצילום ומסמנת בעיגול אדום אזורים החשודים כדלקת ריאות, על סמך אימון על מיליוני צילומים בעבר. המערכת אינה יוצרת טקסט חופשי או תמונות חדשות מאפס.",
                aiOutput: "באיזו טכנולוגיה סביר להניח שהמערכת משתמשת?",
                options: [
                    { value: "genai", label: "בינה מלאכותית יוצרת (Generative AI)" },
                    { value: "ml_dl", label: "למידת מכונה (ML) / למידה עמוקה (Deep Learning)" },
                    { value: "llm", label: "מודל שפה ענק (LLM)" }
                ],
                correctAction: "ml_dl",
                explanation: "בדיוק! זוהי מערכת למידת מכונה (Machine Learning) או למידה עמוקה קלאסית, שמטרתה סיווג (Classification) וזיהוי תבניות במידע קיים. היא אינה מייצרת (Generate) תוכן חדש לחלוטין, ולכן זהו לא Gen AI."
            },
            {
                id: 5,
                title: "הנדסת פרומפטים - יצירת תמונה",
                context: "את רוצה לייצר תמונה של אינפוגרפיקה מצוירת להדרכת מטופלים על הזרקת אינסולין. עלייך לבחור את הפרומפט שיפיק את התמונה הטובה והמדויקת ביותר.",
                aiOutput: "איזה משני הפרומפטים הבאים תבחרי להזין?",
                options: [
                    { value: "prompt_a", label: "פרומפט א': תכין לי אינפוגרפיקה מצוירת על אינסולין והזרקה נכונה למטופלים." },
                    { value: "prompt_b", label: "פרומפט ב': פעל כמומחה להדרכת מטופלים. צור תמונה של אינפוגרפיקה חזותית בת 5 שלבים על הזרקת אינסולין למטופל מבוגר. ודא שהטקסט בתמונה הוא בשפה העברית בלבד, מיושר מימין לשמאל (RTL), והדגש ויזואלית אלמנטים של בטיחות." }
                ],
                correctAction: "prompt_b",
                explanation: "פרומפט ב' הוא המנצח! ביצירת תמונות מורכבות המשלבות טקסט, מחוללי תמונות נוטים לייצר 'ג'יבריש' או לכתוב הפוך. לכן, קריטי להגדיר במפורש את השפה (עברית) ואת כיוון הכתב (RTL - Right to Left). בנוסף, הפרומפט נותן למודל הקשר (מומחה) וקהל יעד (מבוגרים)."
            }
        ];

        // מצב המשחק
        let gameStarted = false;
        let currentScenario = 0;
        let score = 0;
        let showFeedback = false;
        let isCorrect = false;
        let gameOver = false;

        // עדכון תצוגה
        function renderApp() {
            const appDiv = document.getElementById('app');
            let html = '';

            // כותרת עליונה
            html += `
                <div class="mb-8 flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/10 backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg">
                            <i data-lucide="activity" class="w-6 h-6 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                                משמרת AI - מחלקה פנימית
                            </h1>
                            <p class="text-xs text-slate-400">סימולטור קבלת החלטות קליניות</p>
                        </div>
                    </div>
                </div>
            `;

            if (!gameStarted) {
                // מסך פתיחה
                html += `
                    <div class="bg-white/10 p-8 rounded-3xl border border-white/20 backdrop-blur-xl shadow-2xl text-center fade-in">
                        <div class="w-24 h-24 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full mx-auto flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(129,140,248,0.5)]">
                            <i data-lucide="stethoscope" class="w-12 h-12 text-white"></i>
                        </div>
                        <h2 class="text-3xl font-bold mb-4 text-white">המשמרת מתחילה!</h2>
                        
                        <div class="bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50 mb-8 max-w-lg mx-auto">
                            <p class="text-lg text-slate-200 leading-relaxed mb-4">
                                תפקידך לוודא שהכל מתנהל כשורה. מערכות הבינה המלאכותית יציעו פעולות, אך <strong>אחריות קבלת ההחלטות נמצאת בידיים שלך</strong>.
                            </p>
                            <p class="text-indigo-300 font-medium">
                                לכל תרחיש יש רק תשובה אחת נכונה.<br/>כיצד תבחר/י לפעול?
                            </p>
                        </div>

                        <button onclick="startGame()" class="flex items-center justify-center gap-2 mx-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold py-3 px-10 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(129,140,248,0.3)] hover:shadow-[0_0_20px_rgba(129,140,248,0.6)] hover:-translate-y-1">
                            <i data-lucide="play" class="w-5 h-5"></i>
                            <span>כניסה למשמרת</span>
                        </button>
                    </div>
                `;
            } else if (!gameOver) {
                // מסך משחק פעיל
                const scenario = scenarios[currentScenario];
                
                // בניית כפתורי האפשרויות
                let optionsHtml = '';
                scenario.options.forEach((option) => {
                    optionsHtml += `
                        <button onclick="handleAction('${option.value}')" class="w-full text-right p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-indigo-500/20 hover:border-indigo-400/50 transition-all duration-300 text-slate-200 font-medium hover:pl-6 focus:outline-none">
                            ${option.label}
                        </button>
                    `;
                });

                // משוב או אפשרויות
                let feedbackHtml = '';
                if (showFeedback) {
                    const icon = isCorrect ? '<i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-400 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-8 h-8 text-rose-400 shrink-0"></i>';
                    const colorClass = isCorrect ? 'bg-emerald-900/30 border-emerald-500/50' : 'bg-rose-900/30 border-rose-500/50';
                    const titleText = isCorrect ? 'תשובה נכונה!' : 'טעות בשיקול הדעת!';
                    const titleColor = isCorrect ? 'text-emerald-400' : 'text-rose-400';

                    feedbackHtml = `
                        <div class="p-6 rounded-2xl border ${colorClass} fade-in mt-4">
                            <div class="flex items-start gap-4">
                                ${icon}
                                <div>
                                    <h3 class="text-xl font-bold mb-2 ${titleColor}">${titleText}</h3>
                                    <p class="text-slate-200 leading-relaxed mb-4">${scenario.explanation}</p>
                                    <button onclick="nextScenario()" class="flex items-center gap-2 bg-white text-slate-900 px-5 py-2 rounded-lg font-bold hover:bg-slate-200 transition-colors">
                                        <span>לתרחיש הבא</span>
                                        <i data-lucide="chevron-right" class="w-4 h-4 rotate-180"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    feedbackHtml = `<div class="flex flex-col gap-3">${optionsHtml}</div>`;
                }

                // כרטיס תרחיש
                html += `
                    <div class="bg-white/10 p-6 rounded-3xl border border-white/20 backdrop-blur-xl shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
                        <div class="absolute bottom-0 left-0 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl -ml-10 -mb-10 pointer-events-none"></div>

                        <div class="relative z-10">
                            <div class="flex justify-between items-center mb-6">
                                <span class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-sm font-medium border border-indigo-500/30">
                                    תרחיש ${currentScenario + 1} מתוך ${scenarios.length}
                                </span>
                                <i data-lucide="brain-circuit" class="w-6 h-6 text-purple-400"></i>
                            </div>

                            <h2 class="text-2xl font-bold mb-4">${scenario.title}</h2>
                            
                            <div class="bg-slate-800/50 p-4 rounded-xl mb-4 border border-slate-700">
                                <p class="text-slate-300 text-sm mb-1">רקע קליני:</p>
                                <p class="font-medium leading-relaxed">${scenario.context}</p>
                            </div>

                            <div class="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 p-5 rounded-xl mb-6 border border-indigo-500/30 relative">
                                <div class="absolute -top-3 right-4 bg-indigo-600 text-xs px-2 py-1 rounded-md font-bold tracking-wider">
                                    פלט AI / המשימה
                                </div>
                                <p class="text-indigo-100 mt-2 text-lg italic leading-relaxed">
                                    "${scenario.aiOutput}"
                                </p>
                            </div>

                            ${feedbackHtml}
                        </div>
                    </div>
                `;
            } else {
                // מסך סיום
                const finalScorePercentage = (score / scenarios.length) * 100;
                let message = '';
                if (finalScorePercentage === 100) message = 'מושלם! את/ה מזהה היטב הטיות, הזיות ובונה פרומפטים מעולים.';
                else if (finalScorePercentage >= 60) message = 'עבודה טובה! אבל חשוב תמיד לשמור על עין ביקורתית מול המערכת ולהקפיד על הנדסת פרומפטים מדויקת.';
                else message = 'כדאי לחזור שוב על חומרי הקורס. הבטיחות הקלינית קודמת לטכנולוגיה!';

                html += `
                    <div class="bg-white/10 p-8 rounded-3xl border border-white/20 backdrop-blur-xl shadow-2xl text-center fade-in">
                        <div class="w-24 h-24 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full mx-auto flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(129,140,248,0.5)]">
                            <i data-lucide="shield-alert" class="w-12 h-12 text-white"></i>
                        </div>
                        <h2 class="text-3xl font-bold mb-2 text-white">המשמרת הסתיימה!</h2>
                        <p class="text-slate-300 mb-6">סיימת את תורנות ה-AI שלך.</p>
                        
                        <div class="bg-slate-900/50 inline-block px-8 py-4 rounded-2xl border border-slate-700 mb-8">
                            <p class="text-sm text-slate-400 mb-1">הציון הסופי שלך</p>
                            <p class="text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                                ${finalScorePercentage}%
                            </p>
                        </div>

                        <p class="text-lg text-indigo-200 mb-8 max-w-md mx-auto">${message}</p>

                        <button onclick="restartGame()" class="flex items-center justify-center gap-2 mx-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold py-3 px-8 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(129,140,248,0.2)] hover:shadow-[0_0_20px_rgba(129,140,248,0.5)]">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                            <span>התחל משמרת חדשה</span>
                        </button>
                    </div>
                `;
            }

            appDiv.innerHTML = html;
            // טעינת האייקונים מחדש לאחר שינוי ה-HTML
            lucide.createIcons();
        }

        // פונקציות המשחק
        window.startGame = function() {
            gameStarted = true;
            currentScenario = 0;
            score = 0;
            gameOver = false;
            showFeedback = false;
            renderApp();
        };

        window.handleAction = function(actionValue) {
            const correct = actionValue === scenarios[currentScenario].correctAction;
            isCorrect = correct;
            if (correct) score += 1;
            showFeedback = true;
            renderApp();
        };

        window.nextScenario = function() {
            showFeedback = false;
            if (currentScenario < scenarios.length - 1) {
                currentScenario += 1;
            } else {
                gameOver = true;
            }
            renderApp();
        };

        window.restartGame = function() {
            gameStarted = false; // חזרה למסך הפתיחה
            renderApp();
        };

        // הפעלה ראשונית
        renderApp();
    </script>
</body>
</html>
